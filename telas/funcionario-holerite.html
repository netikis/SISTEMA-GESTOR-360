<!-- telas/funcionario-holerite.html -->
<div class="main-card" id="tela-assinatura-holerite" style="display: none;">
    <div class="header-logo">
        <img src="https://i.postimg.cc/zDRJMSTn/69420f5a-5b80-457e-8146-00485162d7f2.jpg" crossorigin="anonymous" class="logo-img">
        <div class="title-top">Holerite Digital Oficial</div>
    </div>

    <div id="area-recibo-holerite">
        <div class="recibo-header">HOLERITE PARA ASSINATURA</div>
        <div class="data-recibo" id="hol-f-data">--/--/----</div>
        <div id="hol-f-texto" style="font-size:13px; line-height:1.55; color:#333;">Carregando dados...</div>

        <label style="text-align: center; margin-top: 24px;">1) SELFIE DE COMPROVAÇÃO (obrigatória):</label>
        <p style="font-size: 12px; color: #666; text-align: center; margin: 6px 0 10px;">Tire uma foto do seu rosto para comprovar que foi você quem assinou.</p>
        <div class="botoes-camera-ponto" id="hol-botoes-abrir-camera" style="display:flex; gap:8px;">
            <button id="hol-btn-camera-frontal" type="button" style="flex:1; background: #e0e6ed; color: #1a2a43; border:none; border-radius:10px; padding:12px; font-weight:700; cursor:pointer;" onclick="iniciarCameraHolerite('user')">🤳 Abrir selfie</button>
        </div>
        <button id="hol-btn-trocar-camera" type="button" class="btn-logout" style="display: none; margin-top: 8px; background: #6c757d; color: #fff; width: 100%;" onclick="alternarCameraHolerite()">🔄 Trocar câmera</button>
        <video id="hol-video-selfie" autoplay playsinline muted style="display:none; width:100%; max-height:280px; border-radius:12px; margin-top:10px; background:#111; object-fit:cover;"></video>
        <canvas id="hol-canvas-selfie" style="display: none;"></canvas>
        <img id="hol-foto-tirada" src="" alt="Selfie de comprovação" style="display:none; width:100%; max-height:280px; border-radius:12px; margin-top:10px; object-fit:cover; border:2px solid #28a745;">
        <button id="hol-btn-tirar-foto" type="button" class="btn-gold" style="display: none; margin-top: 10px;" onclick="tirarFotoHolerite()">📸 Tirar Selfie</button>
        <button id="hol-btn-iniciar-camera" type="button" class="btn-logout" style="display: none; margin-top: 8px; background: #e0e6ed;" onclick="iniciarCameraHolerite('user')">🔄 Tirar outra selfie</button>
        <input type="hidden" id="hol-foto-base64" value="">

        <label style="text-align: center; margin-top: 28px;">2) ASSINATURA DIGITAL AQUI:</label>
        <canvas id="signature-pad-holerite"></canvas>
        <button class="btn-limpar" type="button" onclick="limparAssinaturaHolerite()">Corrigir Assinatura</button>
    </div>

    <button class="btn-gold" id="btnAssinarHolerite" type="button" style="margin-top: 25px;" onclick="confirmarAssinaturaHolerite()">CONFIRMAR SELFIE + ASSINATURA</button>
</div>
